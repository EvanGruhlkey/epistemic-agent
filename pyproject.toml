[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "epistemic-types"
version = "0.1.0"
description = "Runtime layer tracking how information is known; enforces safe agent output."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Epistemic Types contributors" }]
keywords = ["ai", "agents", "epistemology", "hallucination", "provenance"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/epistemic"]

[tool.pytest.ini_options]
pythonpath = ["src"]

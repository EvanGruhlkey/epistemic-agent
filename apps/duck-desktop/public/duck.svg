<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img" aria-label="Pixel rubber duck">
  <title>Pixel rubber duck</title>
  <!-- Classic rubber duck: warm yellow, orange beak, highlight + shadow for depth -->
  <g fill="#f0b429">
    <rect x="4" y="12" width="6" height="1"/>
    <rect x="5" y="13" width="4" height="1"/>
  </g>
  <g fill="#ffd93d">
    <rect x="5" y="1" width="4" height="1"/>
    <rect x="4" y="2" width="6" height="1"/>
    <rect x="3" y="3" width="7" height="1"/>
    <rect x="3" y="4" width="8" height="1"/>
    <rect x="2" y="5" width="9" height="1"/>
    <rect x="2" y="6" width="9" height="1"/>
    <rect x="2" y="7" width="8" height="1"/>
    <rect x="3" y="8" width="7" height="1"/>
    <rect x="4" y="9" width="6" height="1"/>
    <rect x="5" y="10" width="4" height="1"/>
    <rect x="6" y="11" width="2" height="1"/>
  </g>
  <g fill="#ffe69a">
    <rect x="5" y="2" width="2" height="1"/>
    <rect x="4" y="5" width="2" height="2"/>
  </g>
  <g fill="#ff9f1c">
    <rect x="11" y="5" width="3" height="1"/>
    <rect x="11" y="6" width="2" height="1"/>
  </g>
  <g fill="#1a1a1a">
    <rect x="7" y="4" width="1" height="1"/>
  </g>
  <rect x="6" y="3" width="1" height="1" fill="#ffffff"/>
</svg>

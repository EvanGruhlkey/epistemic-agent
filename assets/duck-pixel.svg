<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges" role="img">
  <title>Pixel rubber duck</title>
  <!-- tail -->
  <rect fill="#ffd93d" x="11" y="6" width="2" height="3"/>
  <rect fill="#ffd93d" x="10" y="7" width="1" height="2"/>
  <!-- body -->
  <rect fill="#ffd93d" x="5" y="8" width="6" height="4"/>
  <rect fill="#ffd93d" x="4" y="7" width="7" height="2"/>
  <rect fill="#ffe066" x="5" y="8" width="2" height="2"/>
  <!-- neck / head -->
  <rect fill="#ffd93d" x="3" y="4" width="4" height="4"/>
  <rect fill="#ffd93d" x="2" y="3" width="5" height="2"/>
  <rect fill="#ffe066" x="3" y="4" width="2" height="2"/>
  <!-- eye -->
  <rect fill="#2d3436" x="4" y="4" width="1" height="1"/>
  <rect fill="#ffffff" x="5" y="4" width="1" height="1"/>
  <!-- beak -->
  <rect fill="#ff9f1c" x="7" y="5" width="4" height="1"/>
  <rect fill="#ff9f1c" x="8" y="6" width="3" height="1"/>
  <!-- wing -->
  <rect fill="#f4c430" x="6" y="9" width="2" height="2"/>
  <rect fill="#e6b800" x="7" y="10" width="1" height="1"/>
  <!-- feet -->
  <rect fill="#ff9f1c" x="5" y="12" width="2" height="1"/>
  <rect fill="#ff9f1c" x="8" y="12" width="2" height="1"/>
</svg>
